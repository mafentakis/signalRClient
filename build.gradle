plugins {
    id 'java'
}

group = 'com.example'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

def clientMainClass = 'com.example.signalr.SignalRSubscribe'
def serverMainClass = 'com.example.signalr.SignalRServer'

dependencies {
    implementation 'com.microsoft.signalr:signalr:8.0.0'
}

tasks.withType(JavaExec).configureEach {
    group = 'application'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.create('runClient', JavaExec) {
    description = 'Runs the SignalR subscriber client.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(clientMainClass)
}

tasks.create('runServer', JavaExec) {
    description = 'Runs the in-process SignalR-compatible test server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(serverMainClass)
}

tasks.create('fatJar', Jar) {
    archiveBaseName.set('signalRSubscribe')
    archiveClassifier.set('')
    archiveVersion.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    manifest {
        attributes 'Main-Class': clientMainClass
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}
